<div class="container mt-4">
  @if (post(); as isolatedPost) {
    <!-- Single Post View -->
    <app-postViewer [post]="isolatedPost"></app-postViewer>
  } @else {
    <!-- Promoted Posts List -->
    <div class="row row-cols-1 row-cols-md-3 g-4">
      @for (post of posts(); track post.id) {
        <div class="col">
            <div class="card">
                <app-postPreviewer [post]="post"></app-postPreviewer>
            </div>
        </div>
      }
    </div>
  }
</div>
