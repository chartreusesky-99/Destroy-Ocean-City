@if (productsInCart().length === 0) {
    <div class="d-flex flex-column align-items-center justify-content-center p-4 text-muted">
        <i class="bi bi-bag-x-fill mb-2" style="font-size: 2rem;"></i>
        <p class="mb-0 small">Your bag is empty</p>
    </div>
} @else {
    <ul class="list-group list-group-flush">
        @for (product of productsInCart(); track product.productId) {
            <li class="list-group-item d-flex justify-content-between align-items-center">
                <span>Product #{{ product.productId }}</span>
                <span class="text-muted small">x{{ product.quantity }}</span>
            </li>
        }
        <li class="list-group-item d-flex justify-content-between fw-semibold">
            <span>Total</span>
            <span>— TODO —</span>
        </li>
    </ul>
}
