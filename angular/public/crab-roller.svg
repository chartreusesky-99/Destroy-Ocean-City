<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="200" cy="200" r="195" fill="#FF4444" stroke="#FFD700" stroke-width="8"/>
  
  <!-- Inner decorative circle -->
  <circle cx="200" cy="200" r="175" fill="none" stroke="#FFD700" stroke-width="2" stroke-dasharray="8 4"/>
  
  <!-- Crab body -->
  <ellipse cx="200" cy="220" rx="50" ry="40" fill="#FF6B35"/>
  
  <!-- Crab eyes -->
  <g>
    <!-- Left eye stalk -->
    <line x1="185" y1="200" x2="175" y2="175" stroke="#FF6B35" stroke-width="6" stroke-linecap="round"/>
    <circle cx="175" cy="170" r="10" fill="#FFFFFF"/>
    <circle cx="175" cy="170" r="6" fill="#000000"/>
    
    <!-- Right eye stalk -->
    <line x1="215" y1="200" x2="225" y2="175" stroke="#FF6B35" stroke-width="6" stroke-linecap="round"/>
    <circle cx="225" cy="170" r="10" fill="#FFFFFF"/>
    <circle cx="225" cy="170" r="6" fill="#000000"/>
  </g>
  
  <!-- Roller skate wheel integration -->
  <!-- Left claw becomes wheel -->
  <g>
    <path d="M 150 210 Q 130 200 120 220 Q 110 240 130 250 L 150 240 Z" fill="#4A90E2"/>
    <circle cx="130" cy="230" r="15" fill="#333333"/>
    <circle cx="130" cy="230" r="8" fill="#FFD700"/>
  </g>
  
  <!-- Right claw becomes wheel -->
  <g>
    <path d="M 250 210 Q 270 200 280 220 Q 290 240 270 250 L 250 240 Z" fill="#4A90E2"/>
    <circle cx="270" cy="230" r="15" fill="#333333"/>
    <circle cx="270" cy="230" r="8" fill="#FFD700"/>
  </g>
  
  <!-- Crab legs/wheels on bottom -->
  <g>
    <!-- Left side wheels -->
    <circle cx="165" cy="260" r="12" fill="#333333"/>
    <circle cx="165" cy="260" r="6" fill="#FFD700"/>
    
    <circle cx="145" cy="265" r="10" fill="#333333"/>
    <circle cx="145" cy="265" r="5" fill="#FFD700"/>
    
    <!-- Right side wheels -->
    <circle cx="235" cy="260" r="12" fill="#333333"/>
    <circle cx="235" cy="260" r="6" fill="#FFD700"/>
    
    <circle cx="255" cy="265" r="10" fill="#333333"/>
    <circle cx="255" cy="265" r="5" fill="#FFD700"/>
  </g>
  
  <!-- Motion lines for "rolling" effect -->
  <g opacity="0.6">
    <line x1="100" y1="230" x2="85" y2="230" stroke="#FFD700" stroke-width="3" stroke-linecap="round"/>
    <line x1="105" y1="245" x2="90" y2="245" stroke="#FFD700" stroke-width="3" stroke-linecap="round"/>
    <line x1="300" y1="230" x2="315" y2="230" stroke="#FFD700" stroke-width="3" stroke-linecap="round"/>
    <line x1="295" y1="245" x2="310" y2="245" stroke="#FFD700" stroke-width="3" stroke-linecap="round"/>
  </g>
  
  <!-- Top text "THE" -->
  <text x="200" y="90" font-family="Impact, Arial Black, sans-serif" font-size="28" fill="#FFD700" text-anchor="middle" letter-spacing="4">THE</text>
  
  <!-- Main text "CRAB" -->
  <text x="200" y="130" font-family="Impact, Arial Black, sans-serif" font-size="52" fill="#FFFFFF" text-anchor="middle" font-weight="bold" letter-spacing="2">CRAB</text>
  <text x="200" y="130" font-family="Impact, Arial Black, sans-serif" font-size="52" fill="#FFD700" text-anchor="middle" font-weight="bold" letter-spacing="2" opacity="0.3">CRAB</text>
  
  <!-- Main text "ROLLER" -->
  <text x="200" y="335" font-family="Impact, Arial Black, sans-serif" font-size="52" fill="#FFFFFF" text-anchor="middle" font-weight="bold" letter-spacing="2">ROLLER</text>
  <text x="200" y="335" font-family="Impact, Arial Black, sans-serif" font-size="52" fill="#FFD700" text-anchor="middle" font-weight="bold" letter-spacing="2" opacity="0.3">ROLLER</text>
  
  <!-- Bottom tagline -->
  <text x="200" y="365" font-family="Arial, sans-serif" font-size="16" fill="#FFD700" text-anchor="middle" font-style="italic">Ocean City's Favorite Since '82</text>
  
  <!-- Star decorations -->
  <g fill="#FFD700">
    <polygon points="70,120 73,128 81,128 75,133 77,141 70,136 63,141 65,133 59,128 67,128" opacity="0.8"/>
    <polygon points="330,120 333,128 341,128 335,133 337,141 330,136 323,141 325,133 319,128 327,128" opacity="0.8"/>
    <polygon points="50,280 53,288 61,288 55,293 57,301 50,296 43,301 45,293 39,288 47,288" opacity="0.7"/>
    <polygon points="350,280 353,288 361,288 355,293 357,301 350,296 343,301 345,293 339,288 347,288" opacity="0.7"/>
  </g>
</svg>