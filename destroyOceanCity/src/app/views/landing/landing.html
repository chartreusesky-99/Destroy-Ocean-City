<section class="recent-posts">
  <h2>recentPostPreviewer</h2>
  @if (posts().length === 0) {
    <div>
        No posts to display.
    </div>
  }
  <ul>
    @for (post of posts(); track $index) {
        <li>
            <a [href]="post.link" target="_blank">
                <h3 [innerHTML]="post.title.rendered"></h3>
                <p [innerHTML]="post.excerpt.rendered"></p>
            </a>
            <p>No data consumed by author module. This is probably an error.</p>
            <p>authorComponent works!</p>
        </li>
    }
  </ul>
</section>
